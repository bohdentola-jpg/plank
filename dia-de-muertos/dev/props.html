<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><title>Prop gallery</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222}#c{width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head><body><div id="c"></div>
<script type="module">
import * as THREE from 'three';
import { makeProp, PROP_INFO } from '../src/props.js';
import { toon } from '../src/toon.js';
const el = document.getElementById('c');
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(el.clientWidth, el.clientHeight);
r.shadowMap.enabled = true;
el.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f3e6cf');
const cam = new THREE.PerspectiveCamera(30, el.clientWidth / el.clientHeight, 0.01, 50);
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || Object.keys(PROP_INFO).join(',')).split(',');
const cols = +(q.get('cols') || 9);
const gap = 0.42;
const rows = Math.ceil(ids.length / cols);
cam.position.set(0, 2.6, 3.2);
cam.lookAt(0, 0, 0.1);
scene.add(new THREE.HemisphereLight('#fff6e8', '#b5895f', 1.7));
const sun = new THREE.DirectionalLight('#fff1d8', 2.4);
sun.position.set(2, 5, 4);
sun.castShadow = true;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), toon('#e8d5b0'));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const items = [];
ids.forEach((id, i) => {
  const p = makeProp(id, id === 'vela' || id === 'cirio' || id === 'copal' ? { lit: true } : {});
  const c = i % cols, rr = Math.floor(i / cols);
  p.position.set((c - (cols - 1) / 2) * gap, 0, (rr - (rows - 1) / 2) * gap);
  scene.add(p);
  items.push(p);
});
const clock = new THREE.Clock();
let t = 0;
function loop() {
  const dt = clock.getDelta(); t += dt;
  for (const p of items) p.traverse((o) => o.userData.update?.(t, dt));
  r.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
