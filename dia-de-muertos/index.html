<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Marigold Path — A Día de Muertos Adventure</title>
<meta name="description" content="An interactive, educational point-and-click adventure about Día de Muertos (Day of the Dead): help Lupita and her grandmother build an ofrenda." />
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="frame" aria-hidden="true"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>

  <header id="hud" class="hidden">
    <div class="hud-left">
      <button id="btn-bag" class="hud-btn" type="button"><span class="ico" data-icon="bag"></span><span class="badge" id="bag-count">0</span></button>
      <button id="btn-book" class="hud-btn" type="button"><span class="ico" data-icon="book"></span><span class="badge new hidden" id="book-new">!</span></button>
    </div>
    <div class="hud-mid">
      <div id="petals" title=""><span class="ico" data-icon="marigold"></span><span id="petal-count">0</span></div>
      <div id="place"><span id="place-name"></span><span id="place-day"></span></div>
    </div>
    <div class="hud-right">
      <button id="btn-map" class="hud-btn" type="button"><span class="ico" data-icon="map"></span></button>
      <button id="btn-hint" class="hud-btn" type="button"><span class="ico" data-icon="butterfly"></span></button>
      <button id="btn-sound" class="hud-btn" type="button"><span class="ico" data-icon="sound"></span></button>
      <button id="btn-menu" class="hud-btn close" type="button"><span class="ico" data-icon="menu"></span></button>
    </div>
  </header>

  <div id="goal" class="hidden"><span class="ico" data-icon="star"></span><span id="goal-text"></span></div>
  <div id="tooltip" role="status"></div>
  <button id="back-btn" class="hidden" type="button"><span class="ico" data-icon="back"></span><span class="lbl"></span></button>

  <div id="dialog" class="hidden" aria-live="polite">
    <div class="portrait"><img alt="" /></div>
    <div class="bubble">
      <div class="who"></div>
      <div class="text"></div>
      <div class="choices"></div>
      <button class="next" type="button"><span class="ico" data-icon="next"></span></button>
    </div>
  </div>

  <div id="tray" class="hidden"></div>
  <div id="sidepanel" class="hidden"></div>
  <div id="card" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true"></div>
  <div id="toasts"></div>
  <div id="es-pop" class="hidden"></div>
  <div id="fade"></div>

  <section id="title" class="hidden"></section>
  <div id="rotate" role="note"><div><div class="phone"></div><b>Turn your device sideways<br><span>Gira tu dispositivo</span></b><button type="button" class="btn cream small">OK</button></div></div>
  <div id="loading"><div class="spinner"></div><div class="msg">Cargando… Loading…</div></div>
  <noscript><div class="noscript">This game needs JavaScript turned on.</div></noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
