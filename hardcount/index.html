<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HARD COUNT — 7-on-7 Football</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
</head>
<body>
<div id="room">
  <div id="tv">
    <div id="tv-bezel">
      <div id="tv-screen">
        <canvas id="screen"></canvas>
        <div id="tv-glass"></div>
      </div>
    </div>
    <div id="tv-panel">
      <div class="tv-brand">NOVATRON <span>TRINIQUE&nbsp;FLAT</span></div>
      <div class="tv-grille"></div>
      <div class="tv-controls">
        <span class="tv-btn"></span><span class="tv-btn"></span><span class="tv-btn"></span>
        <span id="tv-led"></span>
        <button id="tv-power" title="Power">⏻</button>
      </div>
    </div>
  </div>
  <div id="room-hint">plug in a controller · or use the keyboard</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
