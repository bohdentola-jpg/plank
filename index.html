<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EB GAMES — In-Store Demo Kiosk</title>
<link rel="stylesheet" href="launcher.css" />
</head>
<body>
<div id="kiosk">

  <!-- the plastic hood and marquee at the top of the cabinet -->
  <header id="marquee">
    <div class="mq-logo"><span class="mq-eb">EB</span><span class="mq-games">GAMES</span></div>
    <div class="mq-strip">
      <span>IN-STORE DEMO KIOSK</span>
      <span class="mq-dot">•</span>
      <span>SELECT A TITLE</span>
      <span class="mq-dot">•</span>
      <span>ASK STAFF BEFORE UNPLUGGING</span>
    </div>
    <div class="mq-leds"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <main id="cabinet">
    <!-- the rack of boxed games -->
    <section id="rack-wrap">
      <h1 class="rack-head">ON THE SHELF</h1>
      <div id="rack"></div>
      <div class="rack-foot">2 TITLES LOADED</div>
    </section>

    <!-- the screen: whatever is selected -->
    <section id="screen">
      <div id="detail"></div>
      <div id="hint">↑ ↓ SELECT · ENTER PLAY · ESC BACK</div>
    </section>
  </main>

  <footer id="plate">
    <span>EB GAMES DEMO UNIT · MODEL K-1999</span>
    <span>NO COINS REQUIRED</span>
    <span>CONTROLLERS SUPPORTED — PLUG IN AND PRESS ANY BUTTON</span>
  </footer>

  <div id="wipe"><div class="wipe-inner"><div class="wipe-now">NOW LOADING</div><div class="wipe-title"></div></div></div>
  <div id="kiosk-crt"></div>
</div>
<script type="module" src="src/launcher.js"></script>
</body>
</html>
