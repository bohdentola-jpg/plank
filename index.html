<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EB GAMES 95</title>
<link rel="stylesheet" href="desktop/desktop.css" />
</head>
<body>

  <!-- POST → boot chime → desktop -->
  <div id="boot95"><pre id="boot-text"></pre></div>

  <div id="desktop">
    <div id="icons"></div>
    <div id="windows"></div>
  </div>

  <div id="crt" hidden></div>

  <div id="taskbar">
    <button id="start-btn" class="btn95"><span class="start-logo"></span>Start</button>
    <div id="task-buttons"></div>
    <div id="tray">
      <span id="tray-music" title="EB Hi-Fi is playing" hidden>♪</span>
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="start-menu" hidden>
    <div class="sm-side"><span>EB&nbsp;GAMES&nbsp;95</span></div>
    <div class="sm-items"></div>
  </div>

  <div id="hifi-persist" hidden></div>

  <script type="module" src="desktop/desktop.js"></script>
</body>
</html>
