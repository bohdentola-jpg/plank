<!doctype html>
<html><head><meta charset="utf-8"><title>3RD RAIL — product sheet</title>
<style>
@font-face{font-family:"Bungee";src:url(../fonts/bungee.woff2) format("woff2")}
@font-face{font-family:"Gochi Hand";src:url(../fonts/gochi-hand.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";src:url(../fonts/permanent-marker.woff2) format("woff2")}
@font-face{font-family:"Sedgwick Ave Display";src:url(../fonts/sedgwick-ave-display.woff2) format("woff2")}
@font-face{font-family:"Rubik Wet Paint";src:url(../fonts/rubik-wet-paint.woff2) format("woff2")}
html,body{margin:0;background:#241c44}
canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { PRODUCTS } from '../src/data/catalog.js';
import { drawProduct } from '../src/art/products.js';
import { text, FONTS } from '../src/ink.js';
await Promise.all(['Bungee','Gochi Hand','Permanent Marker','Sedgwick Ave Display','Rubik Wet Paint'].map(f => document.fonts.load(`20px "${f}"`)));
const cv = document.getElementById('c');
const cols = 10, cell = 140;
const rows = Math.ceil(PRODUCTS.length / cols);
const W = cols * cell, H = rows * cell;
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
g.fillStyle = '#2b2350'; g.fillRect(0, 0, W, H);
PRODUCTS.forEach((p, i) => {
  const x = (i % cols) * cell + cell / 2, y = Math.floor(i / cols) * cell + cell / 2 - 8;
  g.fillStyle = '#352c62'; g.fillRect(x - cell/2 + 3, y - cell/2 + 11, cell - 6, cell - 6);
  drawProduct(g, p.art, x, y, 1.05, p.seed);
  text(g, p.name.slice(0, 22), x, y + 62, { size: 10, font: FONTS.hand, fill: '#f6ecd2', lw: 0 });
});
document.title = 'ready';
</script></body></html>
